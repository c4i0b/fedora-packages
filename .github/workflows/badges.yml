name: badges

on:
  # ~1h15 after each autoupdate slot, when most COPR builds have finished;
  # in-flight ones show yellow with the last published version
  schedule:
    - cron: "41 2,6,10,14,18,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  badges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: tools/update-badges.sh caiobruno/fedora-packages c4i0b/fedora-packages
      # [skip ci] keeps the push from re-triggering validate; badge commits
      # never touch packages/, so the COPR webhook stays quiet too
      - run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges README.md
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -qm "chore(badges): refresh [skip ci]"
          git push origin main || (sleep 15; git pull --rebase -X theirs origin main && git push origin main)
