name: validate

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - packages/**
      - tools/**
      - templates/**
      - .copr/**
      - justfile
      - .github/workflows/validate.yml
  push:
    branches: [main]
    paths:
      - packages/**
      - tools/**
      - templates/**
      - .copr/**
      - justfile
      - .github/workflows/validate.yml

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    # bump the tag at each Fedora release
    container: registry.fedoraproject.org/fedora:43
    steps:
      - run: echo "job_start=$(date +%s)" >> "$GITHUB_ENV"
      # dnf on every run is the price of the bare container image; timed so
      # the [phase-summary] telemetry can flag if it ever becomes the bottleneck
      - run: |
          t0=$(date +%s)
          dnf -y install git make rpmdevtools rpmlint just curl
          echo "dnf=$(( $(date +%s) - t0 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
        with:
          # full history: the scope step diffs HEAD against the sha of the
          # last successful run, which force-pushes can orphan (then: full)
          fetch-depth: 0
      # NOTE: no go/cargo module cache anymore. The 4.5GB vendor-caches entry
      # plus the 3GB sources cache breached the 10GB repo quota and LRU-evicted
      # each other on every save (sources restored as pure miss). With the
      # .vendor-ok skip, vendoring only runs on package bumps, and a cold
      # module cache then costs one networked re-vendor for that package.
      # upstream tarballs rpmbuild downloads into the package dirs; the
      # restore-keys prefix makes invalidation per-package-lazy: after a bump
      # only the changed tarball is re-fetched, the prune bounds the size.
      # Saved keys carry a content epoch (name+size manifest) because GitHub
      # caches are immutable: an exact-key hit can never be updated, so a
      # cache saved with an incomplete set would re-download the difference
      # forever. The primary key never matches (saved keys have an epoch
      # suffix); the prefix picks the newest entry.
      # Vendor archives + .vendor-ok stamps ride along (keyed by the same
      # spec hash): vendor-sources.sh reuses them to skip re-vendoring when
      # the fingerprint (spec+sources+script+toolchain) is unchanged.
      # vendor-sources.sh REWRITES source tarballs in place (cargo patch
      # filtering re-packs them): its hash is part of the key so a recipe
      # change can never be served a tarball repacked by an older one (a
      # stale one poisoned soundcraft's vendor step with cargo exit 101).
      - uses: actions/cache/restore@v5
        id: sources_cache
        with:
          path: |
            packages/**/*.tar.*
            packages/**/*.tgz
            packages/**/*.zip
            packages/**/.vendor-ok
          key: sources-v4-${{ hashFiles('packages/*/*.spec', 'tools/vendor-sources.sh') }}
          restore-keys: sources-v4-
      # subset validation: only packages changed since the last green run
      # (cancelled runs leave their changes pending for the next one); every
      # ambiguity — dispatch, tools/templates changes, orphaned sha — is full
      - id: scope
        run: |
          read -r scope pkgs <<< "$(bash tools/validate-scope.sh "$GITHUB_EVENT_NAME")"
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "pkgs=${pkgs:-}" >> "$GITHUB_OUTPUT"
          echo "validate scope: $scope${pkgs:+ ($pkgs)}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          t0=$(date +%s)
          just test
          echo "test=$(( $(date +%s) - t0 ))" >> "$GITHUB_ENV"
        env:
          FEDORA_PACKAGES_DIRECT: "1"
      - run: just validate ${{ steps.scope.outputs.pkgs }}
        env:
          FEDORA_PACKAGES_DIRECT: "1"
          KEEP_SOURCES: "1"
      - run: |
          just prune-sources
          bash tools/ci-summary.sh
        env:
          FEDORA_PACKAGES_DIRECT: "1"
          SCOPE: ${{ steps.scope.outputs.scope }}
          PKGS: ${{ steps.scope.outputs.pkgs }}
          SRCS_CACHE: ${{ steps.sources_cache.outputs.cache-matched-key != '' && 'hit' || 'miss' }}
          JOB_START: ${{ env.job_start }}
      # save only when the post-prune content set differs from what was
      # restored (same set = the immutable entry already holds it); volatile
      # "releases/latest" payloads are pruned before this point and never saved
      - uses: actions/cache/save@v5
        if: steps.sources_cache.outputs.cache-matched-key != format('sources-v4-{0}-{1}', hashFiles('packages/*/*.spec', 'tools/vendor-sources.sh'), env.srcs_epoch)
        with:
          path: |
            packages/**/*.tar.*
            packages/**/*.tgz
            packages/**/*.zip
            !packages/**/*-vendor.tar.bz2
            !packages/**/vendor.tar.zst
          key: sources-v4-${{ hashFiles('packages/*/*.spec', 'tools/vendor-sources.sh') }}-${{ env.srcs_epoch }}
