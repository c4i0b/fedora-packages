name: validate

on:
  pull_request:
    paths:
      - packages/**
      - tools/**
      - templates/**
      - .copr/**
      - justfile
      - .github/workflows/validate.yml
  push:
    branches: [main]
    paths:
      - packages/**
      - tools/**
      - templates/**
      - .copr/**
      - justfile
      - .github/workflows/validate.yml

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    # bump the tag at each Fedora release
    container: registry.fedoraproject.org/fedora:43
    steps:
      - run: dnf -y install git make rpmdevtools rpmlint just
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          # the job container gets HOME=/github/home (not /root), so that is
          # where go/cargo put their module caches
          path: |
            /github/home/go/pkg/mod
            /github/home/.cargo/registry
            /github/home/.cargo/git
          key: vendor-caches-${{ hashFiles('packages/*/go.*', 'packages/*/Cargo.*', 'tools/vendor-sources.sh') }}
          restore-keys: vendor-caches-
      - run: just test
        env:
          FEDORA_PACKAGES_DIRECT: "1"
      - run: just validate
        env:
          FEDORA_PACKAGES_DIRECT: "1"
