name: validate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - packages/**
      - tools/**
      - templates/**
      - .copr/**
      - justfile
      - .github/workflows/validate.yml
  push:
    branches: [main]
    paths:
      - packages/**
      - tools/**
      - templates/**
      - .copr/**
      - justfile
      - .github/workflows/validate.yml

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    # bump the tag at each Fedora release
    container: registry.fedoraproject.org/fedora:43
    steps:
      - run: echo "job_start=$(date +%s)" >> "$GITHUB_ENV"
      # dnf on every run is the price of the bare container image; timed so
      # the [phase-summary] telemetry can flag if it ever becomes the bottleneck
      - run: |
          t0=$(date +%s)
          dnf -y install git make rpmdevtools rpmlint just
          echo "dnf=$(( $(date +%s) - t0 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        id: module_cache
        with:
          # the job container gets HOME=/github/home (not /root), so that is
          # where go/cargo put their module caches
          path: |
            /github/home/go/pkg/mod
            /github/home/.cargo/registry
            /github/home/.cargo/git
          key: vendor-caches-${{ hashFiles('packages/*/go.*', 'packages/*/Cargo.*', 'tools/vendor-sources.sh') }}
          # module/registry caches are content-addressed by dependency version,
          # NOT by toolchain, so a golang/cargo bump in the Fedora image must
          # not invalidate them; bump the vendor-caches-v2- prefix manually
          # only on real cache corruption
          restore-keys: vendor-caches-
      # upstream tarballs rpmbuild downloads into the package dirs; the
      # restore-keys prefix makes invalidation per-package-lazy: after a bump
      # only the changed tarball is re-fetched, the prune bounds the size
      - uses: actions/cache/restore@v5
        id: sources_cache
        with:
          path: |
            packages/**/*.tar.*
            packages/**/*.tgz
            packages/**/*.zip
          key: sources-v1-${{ hashFiles('packages/*/*.spec') }}
          restore-keys: sources-v1-
      - run: |
          t0=$(date +%s)
          just test
          echo "test=$(( $(date +%s) - t0 ))" >> "$GITHUB_ENV"
        env:
          FEDORA_PACKAGES_DIRECT: "1"
      - run: |
          srcs_before=$(find packages -type f \( -name '*.tar.*' -o -name '*.tgz' -o -name '*.zip' \) | wc -l)
          t0=$(date +%s)
          just validate
          echo "validate=$(( $(date +%s) - t0 ))" >> "$GITHUB_ENV"
          # downloads = files rpmbuild had to fetch: 0 on a healthy cache-hit
          # run, >0 without a spec change means a prune/cache bug
          echo "downloads=$(( $(find packages -type f \( -name '*.tar.*' -o -name '*.tgz' -o -name '*.zip' \) | wc -l) - srcs_before ))" >> "$GITHUB_ENV"
        env:
          FEDORA_PACKAGES_DIRECT: "1"
          KEEP_SOURCES: "1"
      - run: |
          just prune-sources
          echo "::notice::[phase-summary] dnf=${dnf} test=${test} validate=${validate} downloads=${downloads} cache=${{ steps.module_cache.outputs.cache-hit == 'true' && 'hit' || 'miss' }} srcs_cache=${{ steps.sources_cache.outputs.cache-hit == 'true' && 'hit' || 'miss' }} srcs_files=$(find packages -type f \( -name '*.tar.*' -o -name '*.tgz' -o -name '*.zip' \) | wc -l) srcs_mb=$(du -sm packages/*/ 2>/dev/null | awk '{s+=$1} END{print s+0}') total=$(( $(date +%s) - job_start ))"
        env:
          FEDORA_PACKAGES_DIRECT: "1"
      # exact key already stored means nothing changed; save would fail on it
      - uses: actions/cache/save@v5
        if: steps.sources_cache.outputs.cache-hit != 'true'
        with:
          path: |
            packages/**/*.tar.*
            packages/**/*.tgz
            packages/**/*.zip
          key: sources-v1-${{ hashFiles('packages/*/*.spec') }}
