name: validate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - packages/**
      - tools/**
      - templates/**
      - .copr/**
      - justfile
      - .github/workflows/validate.yml
  push:
    branches: [main]
    paths:
      - packages/**
      - tools/**
      - templates/**
      - .copr/**
      - justfile
      - .github/workflows/validate.yml

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    # bump the tag at each Fedora release
    container: registry.fedoraproject.org/fedora:43
    steps:
      - run: echo "job_start=$(date +%s)" >> "$GITHUB_ENV"
      # dnf on every run is the price of the bare container image; timed so
      # the [phase-summary] telemetry can flag if it ever becomes the bottleneck
      - run: |
          t0=$(date +%s)
          dnf -y install git make rpmdevtools rpmlint just curl
          echo "dnf=$(( $(date +%s) - t0 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
        with:
          # full history: the scope step diffs HEAD against the sha of the
          # last successful run, which force-pushes can orphan (then: full)
          fetch-depth: 0
      - uses: actions/cache@v5
        id: module_cache
        with:
          # the job container gets HOME=/github/home (not /root), so that is
          # where go/cargo put their module caches
          path: |
            /github/home/go/pkg/mod
            /github/home/.cargo/registry
            /github/home/.cargo/git
          key: vendor-caches-${{ hashFiles('packages/*/go.*', 'packages/*/Cargo.*', 'tools/vendor-sources.sh') }}
          # module/registry caches are content-addressed by dependency version,
          # NOT by toolchain, so a golang/cargo bump in the Fedora image must
          # not invalidate them; bump the vendor-caches-v2- prefix manually
          # only on real cache corruption
          restore-keys: vendor-caches-
      # upstream tarballs rpmbuild downloads into the package dirs; the
      # restore-keys prefix makes invalidation per-package-lazy: after a bump
      # only the changed tarball is re-fetched, the prune bounds the size.
      # Saved keys carry a content epoch (name+size manifest) because GitHub
      # caches are immutable: an exact-key hit can never be updated, so a
      # cache saved with an incomplete set would re-download the difference
      # forever. The primary key never matches (saved keys have an epoch
      # suffix); the prefix picks the newest entry.
      - uses: actions/cache/restore@v5
        id: sources_cache
        with:
          path: |
            packages/**/*.tar.*
            packages/**/*.tgz
            packages/**/*.zip
            !packages/**/*-vendor.tar.bz2
            !packages/**/vendor.tar.zst
          key: sources-v2-${{ hashFiles('packages/*/*.spec') }}
          restore-keys: sources-v2-
      # subset validation: only packages changed since the last green run
      # (cancelled runs leave their changes pending for the next one); every
      # ambiguity — dispatch, tools/templates changes, orphaned sha — is full
      - id: scope
        run: |
          read -r scope pkgs <<< "$(bash tools/validate-scope.sh "$GITHUB_EVENT_NAME")"
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "pkgs=${pkgs:-}" >> "$GITHUB_OUTPUT"
          echo "validate scope: $scope${pkgs:+ ($pkgs)}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          t0=$(date +%s)
          just test
          echo "test=$(( $(date +%s) - t0 ))" >> "$GITHUB_ENV"
        env:
          FEDORA_PACKAGES_DIRECT: "1"
      - run: |
          # vendor archives are REGENERATED each run (not downloads) and their
          # size wobbles, so both the counter and the epoch ignore them
          srcs_before=$(find packages -type f \( -name '*.tar.*' -o -name '*.tgz' -o -name '*.zip' \) -not \( -name '*-vendor.tar.bz2' -o -name 'vendor.tar.zst' \) | wc -l)
          t0=$(date +%s)
          just validate ${{ steps.scope.outputs.pkgs }}
          echo "validate=$(( $(date +%s) - t0 ))" >> "$GITHUB_ENV"
          # downloads = files rpmbuild had to fetch: on a healthy cache-hit run
          # only the 'releases/latest' volatiles (pruned before every save);
          # anything more without a spec change means a prune/cache bug
          echo "downloads=$(( $(find packages -type f \( -name '*.tar.*' -o -name '*.tgz' -o -name '*.zip' \) -not \( -name '*-vendor.tar.bz2' -o -name 'vendor.tar.zst' \) | wc -l) - srcs_before ))" >> "$GITHUB_ENV"
        env:
          FEDORA_PACKAGES_DIRECT: "1"
          KEEP_SOURCES: "1"
      - run: |
          just prune-sources
          echo "srcs_epoch=$(find packages -type f \( -name '*.tar.*' -o -name '*.tgz' -o -name '*.zip' \) -not \( -name '*-vendor.tar.bz2' -o -name 'vendor.tar.zst' \) -printf '%P %s\n' | sort | sha256sum | cut -c1-12)" >> "$GITHUB_ENV"
          echo "::notice::[phase-summary] scope=${{ steps.scope.outputs.scope }}${{ steps.scope.outputs.pkgs && format(' pkgs={0}', steps.scope.outputs.pkgs) || ' pkgs=all' }} dnf=${dnf} dnf_toolchain=${dnf_toolchain:-na} test=${test} validate=${validate} downloads=${downloads} cache=${{ steps.module_cache.outputs.cache-hit == 'true' && 'hit' || 'miss' }} srcs_cache=${{ steps.sources_cache.outputs.cache-matched-key != '' && 'hit' || 'miss' }} srcs_files=$(find packages -type f \( -name '*.tar.*' -o -name '*.tgz' -o -name '*.zip' \) -not \( -name '*-vendor.tar.bz2' -o -name 'vendor.tar.zst' \) | wc -l) srcs_mb=$(du -sm packages/*/ 2>/dev/null | awk '{s+=$1} END{print s+0}') total=$(( $(date +%s) - job_start ))"
        env:
          FEDORA_PACKAGES_DIRECT: "1"
      # save only when the post-prune content set differs from what was
      # restored (same set = the immutable entry already holds it); volatile
      # "releases/latest" payloads are pruned before this point and never saved
      - uses: actions/cache/save@v5
        if: steps.sources_cache.outputs.cache-matched-key != format('sources-v2-{0}-{1}', hashFiles('packages/*/*.spec'), env.srcs_epoch)
        with:
          path: |
            packages/**/*.tar.*
            packages/**/*.tgz
            packages/**/*.zip
            !packages/**/*-vendor.tar.bz2
            !packages/**/vendor.tar.zst
          key: sources-v2-${{ hashFiles('packages/*/*.spec') }}-${{ env.srcs_epoch }}
