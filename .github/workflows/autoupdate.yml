name: autoupdate

on:
  schedule:
    - cron: "23 1-21/4 * * *"
  workflow_dispatch:

permissions:
  contents: write

# serializes manual × delayed-schedule overlaps (seen once on a GitHub cron
# delay day); idempotent, so the newest run may cancel an in-flight one
concurrency:
  group: autoupdate
  cancel-in-progress: true

# fedora container (not ubuntu): bumps must pass the same gate as validate
# (just test / just validate) in-job before reaching main — a GITHUB_TOKEN
# push to main fires the COPR webhook while skipping every GitHub-side
# workflow, so the gate has to run here (gh-actions-conventions rule 11)
jobs:
  autoupdate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: registry.fedoraproject.org/fedora:43
    steps:
      # dnf on every run is the price of the bare container image; timed so
      # the telemetry can flag if it ever becomes the bottleneck
      - run: |
          t0=$(date +%s)
          dnf -y install git make rpmdevtools rpmlint just curl
          echo "dnf=$(( $(date +%s) - t0 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # `bash <script>` instead of direct exec: immune to a lost +x bit.
      # Commits to a bump/<ts> branch and pushes only that branch — main is
      # never pushed here.
      - id: bump
        run: bash .github/scripts/autoupdate.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # the gate: catches what a red PR would have (rea-agents %check,
      # pdfcraft vendoring) before the COPR webhook spends builds on it;
      # a red gate fails the run, the branch stays for inspection
      - id: gate
        if: steps.bump.outputs.count > 0
        run: |
          t0=$(date +%s)
          FEDORA_PACKAGES_DIRECT=1 just test
          echo "gate_test=$(( $(date +%s) - t0 ))" >> "$GITHUB_ENV"
          t0=$(date +%s)
          FEDORA_PACKAGES_DIRECT=1 KEEP_SOURCES=1 just validate ${{ steps.bump.outputs.pkgs }}
          echo "gate_validate=$(( $(date +%s) - t0 ))" >> "$GITHUB_ENV"
        timeout-minutes: 45
      # same notice vocabulary as [phase-summary]: gate timings land in the
      # log even (especially) when the gate itself is what failed
      - name: gate-summary
        if: always() && steps.bump.outputs.count > 0
        run: >
          echo "::notice::[gate-summary] pkgs=${{ steps.bump.outputs.pkgs }}
          test=${gate_test:-na} validate=${gate_validate:-na}"
      # ff-only so main receives the exact SHA the gate validated; if main
      # moved during the gate, fail — the next 4h cycle retries (never
      # rebase-and-merge an ungated SHA). Also runs for a keepalive-only
      # commit (gate skipped: it touches no packages).
      - if: steps.gate.conclusion != 'failure' && (steps.bump.outputs.count > 0 || steps.bump.outputs.keepalive == '1')
        run: bash .github/scripts/autoupdate-merge.sh "${{ steps.bump.outputs.branch }}" "${{ steps.bump.outputs.sha }}"
