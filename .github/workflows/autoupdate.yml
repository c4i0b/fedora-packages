name: autoupdate

on:
  schedule:
    - cron: "23 1-21/4 * * *"
  workflow_dispatch:

permissions:
  contents: write

# serializes manual × delayed-schedule overlaps (seen once on a GitHub cron
# delay day); idempotent, so the newest run may cancel an in-flight one
concurrency:
  group: autoupdate
  cancel-in-progress: true

# no container: bump falls back to python when rpmdev-bumpspec is missing
jobs:
  autoupdate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: .github/scripts/autoupdate.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # retry once on a lost race (concurrent run pushed first)
      - run: git push --follow-tags origin main || (sleep 15; git pull --rebase origin main && git push --follow-tags origin main)
