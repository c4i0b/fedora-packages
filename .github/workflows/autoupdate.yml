name: autoupdate

on:
  schedule:
    - cron: "23 1-21/4 * * *"
  workflow_dispatch:

permissions:
  contents: write

# serializes manual × delayed-schedule overlaps (seen once on a GitHub cron
# delay day); idempotent, so the newest run may cancel an in-flight one
concurrency:
  group: autoupdate
  cancel-in-progress: true

# no container: bump falls back to python when rpmdev-bumpspec is missing
jobs:
  autoupdate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # `bash <script>` instead of direct exec: immune to a lost +x bit
      - run: bash .github/scripts/autoupdate.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # retry once on a lost race (concurrent run pushed first)
      - run: git push --follow-tags origin main || (sleep 15; git pull --rebase origin main && git push --follow-tags origin main)
