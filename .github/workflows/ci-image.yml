name: ci-image

on:
  schedule:
    # weekly rebuild: base tag and packages move under the pinned major,
    # a baked image must be re-baked or it silently rots
    - cron: "17 3 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Containerfile.ci
      - .github/workflows/ci-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Resolve image tag (oldest stable major)
        id: tag
        run: |
          set -euo pipefail
          tag="$(sed -n 's/^FROM registry.fedoraproject.org\/fedora:\([0-9]*\)$/\1/p' Containerfile.ci)"
          [ -n "$tag" ] || { echo "cannot parse base major from Containerfile.ci" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build
        run: docker build -f Containerfile.ci -t "ghcr.io/${{ github.repository_owner }}/fedora-packages-ci:${{ steps.tag.outputs.tag }}" .

      - name: Push
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "ghcr.io/${{ github.repository_owner }}/fedora-packages-ci:${{ steps.tag.outputs.tag }}"
          # new GHCR packages default to private; job `container:` pulls carry
          # no token, so the image must be public
          gh api --method PATCH "/user/packages/container/fedora-packages-ci" \
            -f visibility=public || \
            echo "::warning::could not set visibility; flip it manually in package settings"
